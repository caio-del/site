<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuário - Cine BR</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <!-- Cabeçalho -->
    <header>
      <span class="menu-btn" onclick="abrirMenu()">&#9776;</span>
      <h1 class="logo">Cine BR</h1>
      <span class="usuario-header" id="usuarioHeader"></span>
    </header>

    <!-- Menu lateral -->
    <nav id="menu-lateral" class="menu-lateral">
      <div class="menu-topo">
        <h2>Menu</h2>
        <span class="fechar-btn" onclick="fecharMenu()">&times;</span>
      </div>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobrenos.html">Sobre Nós</a></li>
        <li><a href="premiacoes.html">Premiações</a></li>
        <li><a href="celebridades.html">Celebridades</a></li>
        <li><a href="ultimasnoticias.html">Últimas Notícias</a></li>
        <li><a href="historia.html">História</a></li>
        <li><a href="index.html">Início</a></li>
        <li><a href="usuário.html">Usuário</a></li>
      </ul>
    </nav>

    <!-- Conteúdo principal -->
    <main class="usuario_espaco">
      <section class="login" data-aos="fade-in" data-aos-duration="1000">
        <img
          src="imagens/logo3.png"
          alt="Logo Cine BR"
          class="logo-principal"
        />
        <h2>Bem-vindo, <span id="nomeUsuario"></span>!</h2>
        <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
        <p><strong>Senha:</strong> <span id="senhaUsuario"></span></p>
        <a class="link_usuario" href="index.html">Ir para a pagina principal</a>
      </section>
    </main>

    <footer class="rodape">
      <div class="rodape-conteudo">
        <p>&copy; 2025 Cine BR. Todos os direitos reservados.</p>
        <p>Desenvolvido por Caio Cavalcante</p>
        <div class="redes-sociais">
          <a href="https://www.instagram.com/caiorkn/" title="Instagram"
            >Instagram</a
          >
          <a href="https://github.com/caio-del" title="Github">Github</a>
          <a
            href="https://www.linkedin.com/in/caio-cavalcante-115012339/"
            title="Linkedin"
            >Linkedin</a
          >
        </div>
      </div>
    </footer>

    <script>
      function abrirMenu() {
        document.getElementById("menu-lateral").style.width = "250px";
      }

      function fecharMenu() {
        document.getElementById("menu-lateral").style.width = "0";
      }
      // Recupera os dados do LocalStorage
      document.getElementById("nomeUsuario").innerText =
        localStorage.getItem("usuario");
      document.getElementById("emailUsuario").innerText =
        localStorage.getItem("email");
      document.getElementById("senhaUsuario").innerText =
        localStorage.getItem("senha");
      (function () {
        var nome = localStorage.getItem("usuario");
        var el = document.getElementById("usuarioHeader");
        if (el && nome) {
          el.textContent = nome;
        }
      })();
    </script>
      <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
  AOS.init();
</script>
  </body>
</html>
